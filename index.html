
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to LRC Artisan Flow</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message, source, lineno, error);
      };
      window.process = { env: { NODE_ENV: 'development' } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              lrc: {
                gold: '#C5A059',
                purple: '#6A2C91',
                green: '#78BE20',
                onyx: '#1A1A1A',
                slate: '#5B5F7F',
                stone: '#F5F5F4', // stone-100 equivalent
              }
            },
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            animation: { 
              'float': 'float 6s ease-in-out infinite',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards'
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            backgroundImage: {
              'gradient-brand': 'linear-gradient(135deg, #6A2C91 0%, #C5A059 100%)',
              'gradient-surface': 'linear-gradient(to bottom right, #ffffff, #fafaf9)'
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      
      body { 
        background-color: #FAFAF9; /* Stone 50 */
        color: #1A1A1A; 
        margin: 0; 
      }

      /* Parallax & Scrollbar utilities */
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .parallax-container {
        perspective: 10px;
        overflow-x: hidden;
        overflow-y: auto;
        height: 100vh;
      }
      .parallax-layer {
        position: relative;
        transform-style: preserve-3d;
        z-index: 0;
      }
      .parallax-bg {
        transform: translateZ(-10px) scale(2);
        z-index: -1;
      }
      
      /* Glassmorphism for modern cards */
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }
    </style>

{

    "lucide-react": "https://esm.sh/lucide-react@0.263.1?external=react",
    "clsx": "https://esm.sh/clsx@2.1.0",

  }
}
</script>
